name: Windows build and core smoke
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Keyboop.Core.Smoke/Keyboop.Core.Smoke.csproj
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Keyboop.Windows/Keyboop.Windows.csproj -c Release
      - run: dotnet run --project tests/Keyboop.Core.Smoke/Keyboop.Core.Smoke.csproj
      - uses: actions/upload-artifact@v4
        with:
          name: keyboop-windows-prototype
          path: src/Keyboop.Windows/bin/Release/net10.0-windows/
